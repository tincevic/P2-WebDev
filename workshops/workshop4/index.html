<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SneakerSpot</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="/../Assets/favicon.ico">
</head>
<body>
    <div id="container">
        <div id="header">SneakerSpot</div> <!--einde header-->
        <div id="content">
            <h2>Onze sneakers</h2>

            <div class="product">
                <img src="images/airmaxIII.jpg" alt="Nike Air Max III">
                <h3>Nike Air Max III</h3>
                <p class="prijs">&#131; 299,99</p>
            </div>

            <div class="product">
                <img src="images/PrinceAirJordan11.jpg" alt="Air Jordan 11 (Custom Prince Edition)">
                <h3>Air Jordan 11 (Custom O(+> Edition)</h3>
                <p class="prijs">&#131; 319,-</p>
            </div>

            <div class="product">
                <img src="images/NB550.jpg" alt="New Balance 550">
                <h3>New Balance 550</h3>
                <p class="prijs">&#131; 159,99</p>
            </div>
        </div> <!-- einde content -->
        <div id="footer">&#127279; 1996 SneakerSpot</div> <!--einde footer-->
    </div>
</body>
</html>
